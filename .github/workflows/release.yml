name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publier:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Jeton OIDC pour le « trusted publishing » npm : aucun secret à stocker.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Installer les dépendances
        run: npm ci

      # Le trusted publishing exige npm >= 11.5.1.
      - name: Mettre à jour npm
        run: npm install -g npm@latest

      - name: Vérifier que le tag correspond à la version du package
        run: |
          VERSION_PKG=$(node -p "require('./package.json').version")
          VERSION_TAG=${GITHUB_REF_NAME#v}
          if [ "$VERSION_PKG" != "$VERSION_TAG" ]; then
            echo "::error::Le tag v$VERSION_TAG ne correspond pas à package.json ($VERSION_PKG)"
            exit 1
          fi

      # prepublishOnly rejoue lint + typecheck + tests + build.
      - name: Publier sur npm (provenance)
        run: npm publish --provenance --access public
